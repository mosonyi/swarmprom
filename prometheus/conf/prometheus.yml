global:
  scrape_interval:     15s
  evaluation_interval: 15s

  external_labels:
    monitor: 'promswarm'

rule_files:
  - "swarm_node.rules.yml"
  - "swarm_task.rules.yml"
  - "custom.rules.yml"

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dockerd-exporter'
    dns_sd_configs:
    - names:
      - 'tasks.dockerd-exporter'
      type: 'A'
      port: 9323

  - job_name: 'cadvisor'
    dns_sd_configs:
    - names:
      - 'tasks.cadvisor'
      type: 'A'
      port: 8080

  - job_name: 'node-exporter'
    dns_sd_configs:
    - names:
      - 'tasks.node-exporter'
      type: 'A'
      port: 9100
    relabel_configs:
      # Extract hostname from node metadata
      - source_labels: [__meta_dns_name]
        regex: '(.*)\..*'
        target_label: instance
        replacement: '${1}'
      # Relabel from the metric created by the script
      - source_labels: [node_meta_nodename]
        regex: '(.*)'
        target_label: nodename
        replacement: '${1}'

  - job_name: 'loki'
    dns_sd_configs:
    - names:
      - 'tasks.loki'
      type: 'A'
      port: 3100

  - job_name: 'promtail'
    dns_sd_configs:
    - names:
      - 'tasks.promtail'
      type: 'A'
      port: 9080
